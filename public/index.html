<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My Charts</title>
<script src="lightweight-charts.js"></script>
<script>window.LightweightCharts||document.write('<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"><\/script>')</script>
<script src="kis.js"></script>
<style>
  :root {
    --bg: #070a11;
    --panel: rgba(13, 18, 28, 0.88);
    --panel2: rgba(22, 29, 44, 0.85);
    --hover: rgba(36, 47, 70, 0.92);
    --line: rgba(148, 163, 184, 0.14);
    --line-strong: rgba(56, 189, 248, 0.45);
    --text: #f1f5f9;
    --mute: #94a3b8;
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.32);
    --chart-bg: #070a11;
    --grid: rgba(148, 163, 184, 0.06);
    --xh: #475569;
    --shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
    --modal-bg: #0d1320;
  }

  [data-theme=light] {
    --bg: #f1f5f9;
    --panel: rgba(255, 255, 255, 0.92);
    --panel2: #f8fafc;
    --hover: #e2e8f0;
    --line: rgba(15, 23, 42, 0.1);
    --line-strong: rgba(37, 99, 235, 0.4);
    --text: #0f172a;
    --mute: #64748b;
    --accent: #2563eb;
    --accent-glow: rgba(37, 99, 235, 0.22);
    --chart-bg: #ffffff;
    --grid: rgba(15, 23, 42, 0.05);
    --xh: #334155;
    --shadow: 0 20px 50px rgba(15, 23, 42, 0.16);
    --modal-bg: #ffffff;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font: 500 13.5px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Modern Glass Top Toolbar */
  .tb {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--panel);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--line);
    z-index: 20;
    flex-wrap: wrap;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: -0.01em;
    padding: 6px 10px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.16), rgba(99, 102, 241, 0.12));
    border: 1px solid var(--line);
    white-space: nowrap;
  }

  .brand::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 10px #10b981;
  }

  .sp { flex: 1; }

  .sel, input[type=number], input[type=text] {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 7px 11px;
    font: inherit;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .sel:hover, input[type=number]:hover, input[type=text]:hover {
    border-color: var(--line-strong);
  }

  .sel:focus, input[type=number]:focus, input[type=text]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  #sym {
    font-weight: 700;
    min-width: 132px;
    cursor: pointer;
  }

  /* Segmented Timeframe Switcher */
  .seg {
    display: flex;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .seg::-webkit-scrollbar { display: none; }

  .seg button {
    background: none;
    border: 0;
    color: var(--mute);
    padding: 5px 11px;
    border-radius: 7px;
    font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, monospace;
    cursor: pointer;
    transition: all 0.16s ease;
    white-space: nowrap;
  }

  .seg button:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.05);
  }

  .seg button.on {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 10px var(--accent-glow);
  }

  /* Modern Buttons */
  .btn, .ibtn {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 7px 12px;
    font: 600 13px/1.2 inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .ibtn {
    width: 34px;
    height: 34px;
    padding: 0;
  }

  .btn:hover, .ibtn:hover {
    background: var(--hover);
    border-color: var(--line-strong);
    transform: translateY(-0.5px);
  }

  .btn:active, .ibtn:active {
    transform: translateY(0);
  }

  .btn.pri {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 14px var(--accent-glow);
  }

  .btn.pri:hover {
    filter: brightness(1.08);
  }

  #status {
    color: var(--mute);
    font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--panel2);
    border: 1px solid var(--line);
  }

  /* Chart Viewport */
  #chart {
    flex: 1;
    min-height: 0;
    position: relative;
  }

  #corner {
    position: absolute;
    right: 74px;
    bottom: 34px;
    z-index: 4;
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .pscale {
    display: flex;
    gap: 2px;
    background: var(--panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 3px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
  }

  .pscale button, #goLatest {
    background: none;
    border: 0;
    color: var(--mute);
    font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 4px 9px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .pscale button:hover, #goLatest:hover {
    color: var(--text);
    background: var(--hover);
  }

  .pscale button.on {
    background: var(--accent);
    color: #fff;
  }

  #goLatest {
    display: none;
    align-items: center;
    background: var(--panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line-strong);
    color: var(--text);
    padding: 6px 11px;
    border-radius: 9px;
    font-size: 11.5px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
  }

  /* Floating Legend & HUD Info Card */
  #legend {
    position: absolute;
    top: 10px;
    left: 12px;
    z-index: 4;
    max-width: min(92vw, 350px);
  }

  .lg {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--panel);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 4px 6px 4px 11px;
    font-size: 12.5px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
  }

  .lg.off .nm { opacity: 0.45; }

  .lg button {
    background: none;
    border: 0;
    color: var(--mute);
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    display: flex;
    transition: all 0.15s ease;
  }

  .lg button:hover {
    background: var(--hover);
    color: var(--text);
  }

  .lg svg { width: 15px; height: 15px; }

  #info {
    margin-top: 7px;
    font: 500 11.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--panel);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    pointer-events: none;
    display: none;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
  }

  /* Next-Level Modern Modal & Settings Popup */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .ov {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 15, 0.68);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 14px;
    animation: fadeIn 0.16s ease-out;
  }

  .md {
    background: var(--modal-bg);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    width: min(100%, 500px);
    max-height: 88dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .md-h {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 18px 12px;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.01em;
    border-bottom: 1px solid var(--line);
  }

  .md-h button {
    background: var(--panel2);
    border: 1px solid var(--line);
    color: var(--mute);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    transition: all 0.15s ease;
  }

  .md-h button:hover {
    background: var(--hover);
    color: var(--text);
  }

  /* Segmented Pill Tabs inside Popup */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 10px 18px;
    background: var(--panel2);
    border-bottom: 1px solid var(--line);
  }

  .tabs button {
    background: transparent;
    border: 1px solid transparent;
    color: var(--mute);
    padding: 6px 14px;
    border-radius: 8px;
    font: 600 13px inherit;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .tabs button:hover {
    color: var(--text);
  }

  .tabs button.on {
    background: var(--modal-bg);
    color: var(--text);
    border-color: var(--line);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  }

  .md-b {
    padding: 8px 18px 16px;
    overflow-y: auto;
    flex: 1;
  }

  .grp {
    margin: 16px 0 8px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 12px;
    margin-bottom: 6px;
    border-radius: 11px;
    background: var(--panel2);
    border: 1px solid var(--line);
    min-height: 44px;
    transition: border-color 0.15s ease;
  }

  .row:hover {
    border-color: var(--line-strong);
  }

  .row > span {
    font-size: 13px;
    font-weight: 500;
  }

  .row input[type=number] {
    width: 96px;
    text-align: right;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .row .sel {
    max-width: 225px;
  }

  /* Modern Toggle Switch for Checkboxes */
  .row input[type=checkbox] {
    appearance: none;
    -webkit-appearance: none;
    width: 40px;
    height: 22px;
    background: rgba(148, 163, 184, 0.25);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s ease;
    flex-shrink: 0;
  }

  .row input[type=checkbox]::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .row input[type=checkbox]:checked {
    background: var(--accent);
  }

  .row input[type=checkbox]:checked::after {
    transform: translateX(18px);
  }

  .row input[type=color] {
    width: 44px;
    height: 30px;
    padding: 2px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--modal-bg);
    cursor: pointer;
  }

  .row.dis {
    opacity: 0.4;
    pointer-events: none;
  }

  .md-f {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    padding: 13px 18px;
    background: var(--panel2);
    border-top: 1px solid var(--line);
  }

  .md-f .sp { flex: 1; }

  .srch {
    width: calc(100% - 36px);
    margin: 12px 18px;
  }

  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 18px;
    cursor: pointer;
    border-top: 1px solid var(--line);
    transition: background 0.15s ease;
  }

  .item:hover { background: var(--hover); }
  .item small { display: block; color: var(--mute); margin-top: 2px; }

  .badge {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(59, 130, 246, 0.14);
    border: 1px solid rgba(59, 130, 246, 0.3);
    border-radius: 999px;
    padding: 3px 9px;
  }

  /* Mobile-First Responsive Polish */
  @media (max-width: 768px) {
    .tb {
      padding: 7px 10px;
      gap: 6px;
    }

    .brand {
      font-size: 13px;
      padding: 5px 8px;
    }

    #sym {
      min-width: 112px;
      padding: 6px 8px;
      font-size: 13px;
    }

    .seg {
      order: 3;
      width: 100%;
      justify-content: space-between;
    }

    .seg button {
      flex: 1;
      text-align: center;
      padding: 6px 6px;
    }

    #status {
      display: none;
    }

    #corner {
      right: 58px;
      bottom: 28px;
    }

    #legend {
      top: 8px;
      left: 8px;
      max-width: calc(100vw - 75px);
    }

    #info {
      font-size: 10.5px;
      padding: 6px 9px;
    }

    .ov {
      align-items: flex-end;
      padding: 0;
    }

    .md {
      width: 100%;
      max-width: 100%;
      max-height: 88dvh;
      border-radius: 20px 20px 0 0;
      border-bottom: 0;
    }

    .row .sel {
      max-width: 165px;
    }
  }
</style>
</head>
<body>
<header class="tb">
  <div class="brand">My Charts</div>
  <select id="sym" class="sel" aria-label="Symbol"></select>
  <div class="seg" id="tfs"></div>
  <button class="btn" id="indBtn"><span id="icoAct"></span>Indicators</button>
  <div class="sp"></div>
  <span id="status">Ready</span>
  <button class="ibtn" id="refresh" title="Refresh data"></button>
  <button class="ibtn" id="cset" title="Chart settings"></button>
  <button class="ibtn" id="theme" title="Dark / Light mode"></button>
</header>
<div id="chart">
  <div id="corner">
    <button id="goLatest" title="Go to latest bar (End)">Latest ▶▶</button>
    <div class="pscale">
      <button id="bPct" title="Percentage scale">%</button>
      <button id="bLog" title="Logarithmic scale">log</button>
      <button id="bAuto" title="Auto scale (Alt+R reset)">auto</button>
    </div>
  </div>
  <div id="legend">
    <div id="lgRow"></div>
    <div id="info"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
