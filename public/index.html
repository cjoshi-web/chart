<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Charts</title>
<script src="lightweight-charts.js"></script>
<script>window.LightweightCharts||document.write('<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"><\/script>')</script>
<script src="kis.js"></script>
<style>
:root{--bg:#0f131a;--panel:#151a22;--panel2:#1c222c;--hover:#232b37;--line:#262e3a;--text:#e3e8ef;--mute:#8794a6;--accent:#2962ff;--chart-bg:#0f131a;--grid:#19202a;--shadow:0 12px 40px rgba(0,0,0,.5)}
[data-theme=light]{--bg:#f3f5f8;--panel:#fff;--panel2:#f0f3f7;--hover:#e6eaf0;--line:#e0e4ea;--text:#131722;--mute:#6a7485;--chart-bg:#fff;--grid:#eef1f5;--shadow:0 12px 40px rgba(20,30,50,.18)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.2px;margin-right:6px}
.sp{flex:1}
.sel,input[type=number]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;outline:none}
.sel:focus,input[type=number]:focus{border-color:var(--accent)}
#sym{font-weight:600;min-width:130px}
.seg{display:flex;background:var(--panel2);border-radius:8px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:var(--mute);padding:5px 11px;border-radius:6px;font:inherit;cursor:pointer}
.seg button:hover{color:var(--text)}.seg button.on{background:var(--accent);color:#fff}
.btn,.ibtn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.ibtn{padding:7px 8px}.btn:hover,.ibtn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.1)}
#status{color:var(--mute);font-size:12px}
#chart{flex:1;min-height:0;position:relative}
#legend{position:absolute;top:8px;left:10px;z-index:3;max-width:min(92%,330px)}
.lg{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);border-radius:8px;padding:3px 4px 3px 10px;font-size:13px}
.lg.off .nm{opacity:.45}
.lg button{background:none;border:0;color:var(--mute);cursor:pointer;padding:3px;border-radius:5px;display:flex}
.lg button:hover{background:var(--hover);color:var(--text)}.lg svg{width:15px;height:15px}
#info{margin-top:6px;font-size:12px;line-height:1.55;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;pointer-events:none;display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.md{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(100%,480px);max-height:88vh;display:flex;flex-direction:column}
.md-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;font-weight:700;font-size:16px}
.md-h button{background:none;border:0;color:var(--mute);cursor:pointer;display:flex;padding:4px;border-radius:6px}.md-h button:hover{background:var(--hover)}
.tabs{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:8px 0;font:inherit;cursor:pointer}
.tabs button.on{color:var(--text);border-color:var(--accent)}
.md-b{padding:6px 16px 10px;overflow:auto;flex:1}
.grp{margin:14px 0 4px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;min-height:38px}
.row input[type=number]{width:96px}.row .sel{max-width:230px}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.row input[type=color]{width:42px;height:30px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.row.dis{opacity:.4}
.md-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.md-f .sp{flex:1}
.srch{width:calc(100% - 32px);margin:4px 16px 8px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;cursor:pointer;border-top:1px solid var(--line)}
.item:hover{background:var(--hover)}.item small{display:block;color:var(--mute)}
.badge{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
</style></head><body>
<header class="tb">
  <div class="brand">My Charts</div>
  <select id="sym" class="sel" aria-label="Symbol"></select>
  <div class="seg" id="tfs"></div>
  <button class="btn" id="indBtn"><span id="icoAct"></span>Indicators</button>
  <div class="sp"></div>
  <span id="status">Ready</span>
  <button class="ibtn" id="refresh" title="Refresh data"></button>
  <button class="ibtn" id="theme" title="Dark / Light mode"></button>
</header>
<div id="chart"><div id="legend"><div id="lgRow"></div><div id="info"></div></div></div>
<script src="app.js"></script>
</body></html>
