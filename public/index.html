<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Charts</title>
<script src="lightweight-charts.js"></script>
<script>window.LightweightCharts||document.write('<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"><\/script>')</script>
<script src="kis.js"></script>
<style>
:root{--bg:#0f131a;--panel:#151a22;--panel2:#1c222c;--hover:#232b37;--line:#262e3a;--text:#e3e8ef;--mute:#8794a6;--accent:#2962ff;--chart-bg:#0f131a;--grid:#19202a;--xh:#4c525e;--shadow:0 12px 40px rgba(0,0,0,.5)}
[data-theme=light]{--bg:#f3f5f8;--panel:#fff;--panel2:#f0f3f7;--hover:#e6eaf0;--line:#e0e4ea;--text:#131722;--mute:#6a7485;--chart-bg:#fff;--grid:#eef1f5;--xh:#131722;--shadow:0 12px 40px rgba(20,30,50,.18)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.2px;margin-right:6px}
.sp{flex:1}
.sel,input[type=number]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;outline:none}
.sel:focus,input[type=number]:focus{border-color:var(--accent)}
#sym{font-weight:600;min-width:130px}
.seg{display:flex;background:var(--panel2);border-radius:8px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:var(--mute);padding:5px 11px;border-radius:6px;font:inherit;cursor:pointer}
.seg button:hover{color:var(--text)}.seg button.on{background:var(--accent);color:#fff}
.btn,.ibtn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.ibtn{padding:7px 8px}.btn:hover,.ibtn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.1)}
#status{color:var(--mute);font-size:12px}
#chart{flex:1;min-height:0;position:relative}
#corner{position:absolute;right:72px;bottom:34px;z-index:3;display:flex;gap:6px;align-items:center}
.pscale{display:flex;gap:2px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:2px}
.pscale button,#goLatest{background:none;border:0;color:var(--mute);font:600 11px system-ui,sans-serif;padding:4px 8px;border-radius:6px;cursor:pointer}
.pscale button:hover,#goLatest:hover{color:var(--text);background:var(--hover)}.pscale button.on{background:var(--accent);color:#fff}
#goLatest{display:none;align-items:center;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);font-size:12px}
#legend{position:absolute;top:8px;left:10px;z-index:3;max-width:min(92%,330px)}
.lg{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);border-radius:8px;padding:3px 4px 3px 10px;font-size:13px}
.lg.off .nm{opacity:.45}
.lg button{background:none;border:0;color:var(--mute);cursor:pointer;padding:3px;border-radius:5px;display:flex}
.lg button:hover{background:var(--hover);color:var(--text)}.lg svg{width:15px;height:15px}
#info{margin-top:6px;font-size:12px;line-height:1.55;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;pointer-events:none;display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.md{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(100%,480px);max-height:88vh;display:flex;flex-direction:column}
.md-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;font-weight:700;font-size:16px}
.md-h button{background:none;border:0;color:var(--mute);cursor:pointer;display:flex;padding:4px;border-radius:6px}.md-h button:hover{background:var(--hover)}
.tabs{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:8px 0;font:inherit;cursor:pointer}
.tabs button.on{color:var(--text);border-color:var(--accent)}
.md-b{padding:6px 16px 10px;overflow:auto;flex:1}
.grp{margin:14px 0 4px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;min-height:38px}
.row input[type=number]{width:96px}.row .sel{max-width:230px}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.row input[type=color]{width:42px;height:30px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.row.dis{opacity:.4}
.md-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.md-f .sp{flex:1}
.srch{width:calc(100% - 32px);margin:4px 16px 8px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;cursor:pointer;border-top:1px solid var(--line)}
.item:hover{background:var(--hover)}.item small{display:block;color:var(--mute)}
.badge{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:2px 7px}

/* ---- modern look + mobile ---- */
[data-theme=dark]{--bg:#0a0d13;--panel:#12161e;--panel2:#1a1f29;--hover:#232a37;--line:#232a36;--accent:#3d6bff;--chart-bg:#0a0d13;--grid:#151b25}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}body{height:100dvh}
.tb{background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(14px);position:relative;z-index:5;padding-top:max(8px,env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
.brand{display:flex;align-items:center;gap:8px;font-size:16px;letter-spacing:.3px}.brand b{background:linear-gradient(90deg,#6c8cff,#37d6c1);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn,.ibtn,.sel,.seg button{transition:background .15s,border-color .15s,color .15s,transform .1s}.btn:active,.ibtn:active{transform:scale(.96)}
.seg button.on{box-shadow:0 2px 10px rgba(61,107,255,.45)}
#sym{border-radius:999px;padding-left:14px;font-weight:700}
.ov{backdrop-filter:blur(4px)}.md{animation:pop .18s ease}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}@keyframes sheet{from{transform:translateY(100%)}}
.md{width:min(100%,520px)}.md-b{scrollbar-width:thin}
.srchw{padding:0 16px 8px}.srchw .srch{width:100%;margin:0;border-radius:10px}
.grp{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;padding:8px 0;border-bottom:1px solid var(--line);margin:10px 0 4px}
.grp i{font-style:normal;transition:transform .2s}.grp.c i{transform:rotate(-90deg)}
.row .lb{display:flex;flex-direction:column;min-width:0}.row .lb small{color:var(--mute);font-size:11px;line-height:1.3;max-width:240px}
.row .sw{position:relative;width:44px;height:25px;flex:none}.row .sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;background:var(--hover);border-radius:20px;transition:.2s}.sw span:after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.sw input:checked+span{background:var(--accent)}.sw input:checked+span:after{transform:translateX(19px)}
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel2);overflow:hidden;flex:none}
.stp button{background:none;border:0;color:var(--mute);width:34px;height:34px;font-size:18px;cursor:pointer}.stp button:hover{background:var(--hover);color:var(--text)}
.row .stp input{width:70px;border:0;border-radius:0;text-align:center;background:transparent;padding:6px 2px}
.clr{display:flex;align-items:center;gap:8px;color:var(--mute);font:12px ui-monospace,monospace}
.row .clr input[type=color]{width:36px;height:30px;padding:0;border:2px solid var(--line);border-radius:8px;background:none;cursor:pointer}
.row .sel{max-width:220px}.row.dis{opacity:.4}
.md-f{padding-bottom:max(12px,env(safe-area-inset-bottom))}
@media (max-width:700px){
  .tb{gap:6px;padding-top:max(6px,env(safe-area-inset-top))}
  .brand b{display:none}.brand svg{width:24px;height:24px}
  #sym{min-width:0;max-width:140px;padding:8px 12px}
  #indBtn .t{display:none}#indBtn{padding:8px 10px}
  #status{display:none}
  .seg{order:10;flex:1 1 100%;overflow-x:auto;scrollbar-width:none}.seg button{flex:1 0 auto;padding:7px 14px}
  .btn,.ibtn{min-height:38px}
  #legend{max-width:calc(100% - 16px);left:8px}.lg{font-size:12px}#info{font-size:11px;padding:5px 8px}
  #corner{right:66px;bottom:30px}
  .ov{align-items:flex-end;padding:0}
  .md{width:100%;max-height:92dvh;border-radius:20px 20px 0 0;animation:sheet .22s ease}
  .row{min-height:44px}.row .sel{max-width:170px}.row .lb small{max-width:180px}
}
</style></head><body>
<header class="tb">
  <div class="brand"><svg viewBox="0 0 24 24" style="color:#6c8cff"><path d="M3 17l5-6 4 3 8-9"/><path d="M15 5h5v5"/></svg><b>My Charts</b></div>
  <select id="sym" class="sel" aria-label="Symbol"></select>
  <div class="seg" id="tfs"></div>
  <button class="btn" id="indBtn"><span id="icoAct"></span><span class="t">Indicators</span></button>
  <div class="sp"></div>
  <span id="status">Ready</span>
  <button class="ibtn" id="refresh" title="Refresh data"></button>
  <button class="ibtn" id="cset" title="Chart settings"></button>
  <button class="ibtn" id="theme" title="Dark / Light mode"></button>
</header>
<div id="chart"><div id="corner"><button id="goLatest" title="Go to latest bar (End)">Latest ▶▶</button><div class="pscale"><button id="bPct" title="Percentage scale">%</button><button id="bLog" title="Logarithmic scale">log</button><button id="bAuto" title="Auto scale (Alt+R reset)">auto</button></div></div><div id="legend"><div id="lgRow"></div><div id="info"></div></div></div>
<script src="app.js"></script>
</body></html>
